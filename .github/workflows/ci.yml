name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/windows-supervisor

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Rust format
        run: pnpm rust:fmt

      - name: Rust clippy
        run: pnpm rust:check

      - name: Rust tests
        run: pnpm rust:test

      - name: Native build
        run: pnpm native:build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Desktop build
        run: pnpm --filter @threadhelm/desktop build

      - name: Architecture proof + Windows integration tests
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e
