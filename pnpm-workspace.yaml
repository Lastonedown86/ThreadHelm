packages:
  - apps/*
  - packages/*
  - native/*

# Postinstall scripts allowed to run. esbuild fetches/verifies its platform
# binary; Electron downloads its runtime. Everything else stays blocked.
# better-sqlite3 ships prebuilds/<platform>-<arch>.node in the tarball and
# loads it ahead of build/Release; allowing it makes pnpm run an implicit
# `node-gyp rebuild` (it ignores "gypfile": false) that needs Visual Studio.
allowBuilds:
  esbuild: true
  electron: true
  better-sqlite3: false
  node-pty: true
  electron-winstaller: true

# @electron-forge/shared-types -> @electron/rebuild pulls @electron/node-gyp
# from git. Required by Forge 7; scoped to the Electron org.
blockExoticSubdeps: false

# Electron Forge requires a hoisted layout to package the app.
nodeLinker: hoisted

# Dependabot: transitive dev-tooling deps (Electron tooling → tar, inquirer → tmp).
overrides:
  tar: ^7.5.22
  tmp: ^0.2.7
